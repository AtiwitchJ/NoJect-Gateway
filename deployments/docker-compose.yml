version: "3.8"

services:
  guard-engine:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.guard
    container_name: noject-guard-engine
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - noject-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:50051/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.gateway
    container_name: noject-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../configs/gateway.yaml:/app/configs/gateway.yaml:ro
      - ../logs:/app/logs
    depends_on:
      guard-engine:
        condition: service_healthy
    networks:
      - noject-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: noject-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - noject-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: noject-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - noject-net
    depends_on:
      - prometheus

networks:
  noject-net:
    driver: bridge
